<section class="booth-controls" aria-labelledby="camera-title"><h2 id="camera-title">Your camera</h2><div class="actions">
<button id="open">Open camera</button>
<button id="capture" disabled>Take photo</button>
<a class="download" id="download" download="photo-with-zohan.png" hidden>Download photo</a>
<button id="stop" hidden>Close camera</button>
</div>
<p id="status" role="status">Your camera and photos stay on this device.</p>
</section></div>
</main>
<footer class="site-foot"><a class="site-logo" href="index.html"><span aria-hidden="true">✦</span>Zohan’s World</a></footer>
<script>
const byId = id => document.getElementById(id);
const camera = byId('camera'), mascot = byId('mascot'), result = byId('result');
const open = byId('open'), capture = byId('capture'), stop = byId('stop');
const download = byId('download'), status = byId('status');
let stream;
function closeCamera() {
  stream?.getTracks().forEach(track => track.stop());
  stream = undefined;
  camera.srcObject = null;
  camera.hidden = true;
  capture.disabled = true;
  stop.hidden = true;
  open.disabled = false;
}
open.onclick = async () => {
  if (!navigator.mediaDevices?.getUserMedia) {
    status.textContent = 'Open the photo booth on an HTTPS site or localhost to use the camera.';
    return;
  }
  open.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    camera.srcObject = stream;
    await camera.play();
    result.hidden = true;
    download.hidden = true;
    camera.hidden = false;
    capture.disabled = false;
    stop.hidden = false;
    status.textContent = 'Camera ready. Say cheese!';
  } catch (error) {
    closeCamera();
    status.textContent = error.name === 'NotAllowedError'
      ? 'Allow camera access in your browser, then try again.'
      : 'The camera could not start. Check that it is connected and available.';
  }
};
stop.onclick = () => {closeCamera(); status.textContent = 'Camera closed.';};
capture.onclick = async () => {
  try { await mascot.decode(); } catch {
    status.textContent = 'Zohan’s picture could not load. Refresh and try again.';
    return;
  }
  if (!stream || !camera.videoWidth) return;
  const ctx = result.getContext('2d');
  const {width,height} = result;
  const scale = Math.max(width/camera.videoWidth,height/camera.videoHeight);
  const w = camera.videoWidth*scale, h = camera.videoHeight*scale;
  ctx.save();
  ctx.translate(width,0);
  ctx.scale(-1,1);
  ctx.drawImage(camera,(width-w)/2,(height-h)/2,w,h);
  ctx.restore();
  const stampHeight = height*.76, stampWidth = mascot.naturalWidth/mascot.naturalHeight*stampHeight;
  ctx.drawImage(mascot,width-stampWidth-14,height*.93-stampHeight,stampWidth,stampHeight);
  ctx.fillStyle = '#3e2674';
  ctx.fillRect(0,height-54,width,54);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 29px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Zohan’s World ★',width/2,height-17);
  download.href = result.toDataURL('image/png');
  download.hidden = false;
  result.hidden = false;
  closeCamera();
  open.textContent = 'Take another';
  status.textContent = 'Your photo is ready to download.';
};
window.addEventListener('pagehide',closeCamera);
</script>
