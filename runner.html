const choice = document.querySelector('#runner');
let playing = false, last = 0, distance = 0, rings = 0, lift = 0, velocity = 0, items = [], next = 0;
function box(color,x,y,w,h) { ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }
function label(value,x,y,size,color='#252047') {
  ctx.fillStyle=color;
  ctx.font='800 '+size+'px system-ui';
  ctx.textAlign='center';
  ctx.fillText(value,x,y);
}
function oval(x,y,rx,ry,color) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill();
}
function polygon(color, points) {
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.closePath(); ctx.fill();
}
const designs = [
  { coat:'#1769e1', muzzle:'#f7c397', eyes:'#278650', shoe:'#ec3540' },
  { coat:'#e83d49', muzzle:'#e5a97e', eyes:'#74409b', shoe:'#37a35b' },
  { coat:'#f4a227', muzzle:'#fff8e7', eyes:'#3da5e1', shoe:'#df4145' },
  { coat:'#ee3035', muzzle:'#9e1c32', eyes:'#211b29', shoe:'#e62038' },
  { coat:'#66758e', muzzle:'#f5eee1', eyes:'#678e37', shoe:'#f5eee1' },
  { coat:'#ab6038', muzzle:'#ffe0ad', eyes:'#241927', shoe:'#c0794e' }
];
function face(i,x,y,stride) {
  const {coat,muzzle,eyes,shoe}=designs[i];
  ctx.save(); ctx.translate(x,y);
  const kick=Math.sin(stride)*8;
  oval(-kick,22,8,4,shoe); oval(kick+5,24,8,4,shoe);
  oval(0,13,12,12,coat);
  if(i===2) {
    oval(-16,15,12,5,'#f4a227'); oval(-14,21,12,5,'#f4a227');
    oval(-24,14,5,4,'#fff8e7'); oval(-23,22,5,4,'#fff8e7');
  }
  if(i===0) polygon(coat,[[-1,-25],[-27,-24],[-17,-13],[-28,-10],[-16,-5],[-24,4],[-7,2]]);
  if(i===1) for(const offset of [-16,-10,-4]) oval(offset,1,4,16,coat);
  if(i===2 || i===4) {
    polygon(coat,[[-17,-10],[-19,-32],[-2,-21],[9,-19],[18,-31],[19,-8]]);
    polygon('#f3949b',[[-15,-17],[-16,-26],[-7,-19],[12,-18],[16,-25],[15,-15]]);
  }
  if(i===5) {
    oval(-13,-15,11,12,coat); oval(12,-15,11,12,coat);
    oval(-14,-16,7,8,'#ed9d96'); oval(13,-16,7,8,'#ed9d96');
  }
  if(i===3) for(const dx of [-13,-9,-4,3,10,15]) oval(dx,-10,5,15,coat);
  oval(0,-8,18,16,coat);
  oval(5,0,13,8,muzzle);
  for(const dx of [-3,9]) {
    oval(dx,-12,6,8,'white'); oval(dx+2,-10,3,4,eyes);
    oval(dx+2,-10,1.5,2.5,'#251f30');
  }
  oval(7,-5,i===3?7:4,i===3?5:3,i===3?'#ff9c20':'#28202c');
  if(i===3) oval(5,3,8,3,'#4a1b2c');
  if(i===4 || i===5) {
    ctx.strokeStyle='#34263c';ctx.lineWidth=1.25;ctx.beginPath();
    ctx.moveTo(9,1);ctx.lineTo(24,-2);ctx.moveTo(9,3);ctx.lineTo(24,5);ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  const sky=ctx.createLinearGradient(0,0,0,ground);
  sky.addColorStop(0,'#7969e9');sky.addColorStop(.5,'#9edcfa');sky.addColorStop(1,'#fff1b8');
  box(sky,0,0,840,330);
  oval(695,66,36,36,'#fff2aa');
  for(let i=0;i<5;i++) {
    const cloud=i*210+60-distance*.18%210;
    const y=66+(i%2)*30;
    oval(cloud,y,43,10,'#ffffffb8');
    oval(cloud+14,y-9,20,11,'#ffffffe0');
  }
  for(let i=0;i<6;i++) oval(i*200-distance*.5%200,242,132,91,'#78aee0');
  for(let i=0;i<7;i++) oval(i*150-distance%150,257,106,57,'#62c5a0');
  box('#a9ed86',0,ground-37,840,8);
  box('#427b78',0,ground-29,840,29);
  box('#544283',0,ground,840,60);
  box('#fdce75',0,ground,840,4);
  for(let i=0;i<13;i++) box('#e2cff9',i*75-distance*2%75,293,34,4);
  const stride=distance*1.15;
  crew.forEach((runner,i)=>{
    const fy=ground-61-(i%2)*12-Math.abs(Math.sin(runner.phase))*5;
    oval(runner.x,fy+25,18,3,'#26394880');
    face(i,runner.x,fy,runner.phase);
    label(friends[i],runner.x,fy-35,13,'#242045');
  });
  function brother(name, laneX, jumpHeight, phase) {
    const sprite = name === 'Zavi' ? zavi : zohan;
    const height = name === 'Zavi' ? 73 : 86;
    const bob = Math.abs(Math.sin(phase)) * 5;
    if (sprite.complete && sprite.naturalWidth) {
      const width = height * sprite.naturalWidth / sprite.naturalHeight;
      ctx.save();
      ctx.translate(laneX, ground - jumpHeight - bob);
      ctx.rotate(Math.sin(phase) * .10);
      ctx.drawImage(sprite, -width/2, -height, width, height);
      ctx.restore();
    }
    label(name,laneX,ground-jumpHeight-height-6,16);
  }
  const player = choice.value;
  brother(player === 'Zavi' ? 'Zohan' : 'Zavi', x-85+Math.sin(distance*.085)*11, lift*.65, stride+.65);
  brother(player,x,lift,stride);
  for(const item of items) {
    if(item.type==='ring') {
      ctx.strokeStyle='#ac7100';ctx.lineWidth=9;ctx.beginPath();ctx.arc(item.x,ground-74,12,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#ffde4e';ctx.lineWidth=5;ctx.stroke();
    } else {
      box('#9b4e2d',item.x-15,ground-32,30,32);
      box('#fdad70',item.x-12,ground-29,24,26);
      label('×',item.x,ground-7,24,'#9b4e2d');
    }
  }
}
function update(now) {
  if(!playing)return;
  const dt=Math.min((now-last)/1000,.033);last=now;
  distance+=dt*14;
  velocity-=dt*950;
  lift=Math.max(0,lift+velocity*dt);
  if(lift===0) velocity=0;
  const speed=245+Math.min(180,distance*.65);
  crew.forEach((runner)=>{
    runner.change-=dt;
    if(runner.change<=0) {
      runner.target=(Math.random()-.5)*(speed*.38);
      runner.change=.8+Math.random()*1.7;
    }
    runner.speed+=(runner.target-runner.speed)*Math.min(1,dt*3);
    runner.x=Math.max(35,Math.min(805,runner.x+runner.speed*dt));
    runner.phase+=dt*(speed+runner.speed)*.068;
  });
  if(distance>=next) {
    items.push({x:860,type:Math.random()<.35?'ring':'crate'});
    next=distance+20+Math.random()*10;
  }
  for(const item of items) {
    item.x-=speed*dt;
    if(Math.abs(item.x-x)>25 || item.collected) continue;
    if(item.type==='ring' && lift>20 && lift<100){rings++;item.collected=true;}
    if(item.type==='crate' && lift<29){playing=false;break;}
  }
  items=items.filter(item=>item.x>-20 && !item.collected);
  score.textContent='Rings '+rings+' · Distance '+Math.floor(distance)+' m';
  draw();
  if(playing) requestAnimationFrame(update);
  else {start.disabled=false;choice.disabled=false;jump.disabled=true;start.textContent='Run again';status.textContent='You ran '+Math.floor(distance)+' m and collected '+rings+' rings!';}
}
function leap(){if(playing && lift===0 && velocity===0)velocity=420;}
start.onclick=()=>{
  distance=rings=lift=velocity=0;items=[];next=0;
  crew.forEach((runner,i)=>Object.assign(runner,{x:65+i*138,speed:0,target:0,change:0,phase:i}));
  playing=true;last=performance.now();start.disabled=true;choice.disabled=true;jump.disabled=false;
  status.textContent='The crew is running!';
  requestAnimationFrame(update);
};
jump.onclick=leap;
canvas.addEventListener('pointerdown',leap);
document.addEventListener('keydown',event=>{
  if(!playing || event.repeat || !['Space','ArrowUp'].includes(event.code))return;
  if(event.code==='Space' && event.target===jump)return;
  event.preventDefault();leap();
});
zavi.onload = zohan.onload = draw;
choice.onchange = draw;
draw();
</script>
