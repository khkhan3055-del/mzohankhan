let playing = false, last = 0, distance = 0, rings = 0, lift = 0, velocity = 0, items = [], next = 0;
function box(color,x,y,w,h) { ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }
function label(value,x,y,size,color='#252047') {
  ctx.fillStyle=color;
  ctx.font='800 '+size+'px system-ui';
  ctx.textAlign='center';
  ctx.fillText(value,x,y);
}
function draw() {
  box('#a6e7ff',0,0,840,330);
  for (let i=0;i<5;i++) label('☁',i*210+60-distance*.08%210,73+(i%2)*26,64,'#fff');
  box('#8cdea4',0,ground-30,840,90);
  box('#6453a1',0,ground,840,60);
  for (let i=0;i<13;i++) box('#cdbaff',i*75-distance*2%75,293,34,4);
  const stride = distance * 1.15;
  friends.forEach(([name, icon, color], i) => {
    const fx = 72 + i * 137 + Math.sin(distance * .12 + i) * 13;
    const fy = ground - 41 - Math.abs(Math.sin(stride + i)) * 10;
    box(color, fx - 14, fy + 14, 28, 4);
    label(icon, fx, fy + 9, 36);
    label(name, fx, fy - 27, 15, color);
  });
  const bob = Math.abs(Math.sin(stride)) * 5;
  if (zohan.complete && zohan.naturalWidth) {
    ctx.save();
    ctx.translate(x, ground - lift - bob);
    ctx.rotate(Math.sin(stride) * .12);
    ctx.drawImage(zohan, -28, -86, 64, 86);
    ctx.restore();
  }
  label('Zohan', x, ground-lift-92, 16);
  for(const item of items) {
    if(item.type==='ring') {
      ctx.strokeStyle='#ac7100';ctx.lineWidth=9;ctx.beginPath();ctx.arc(item.x,ground-74,12,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#ffde4e';ctx.lineWidth=5;ctx.stroke();
    } else {
      box('#9b4e2d',item.x-15,ground-32,30,32);
      box('#fdad70',item.x-12,ground-29,24,26);
      label('×',item.x,ground-7,24,'#9b4e2d');
    }
  }
}
function update(now) {
  if(!playing)return;
  const dt=Math.min((now-last)/1000,.033);last=now;
  distance+=dt*14;
  velocity-=dt*950;
  lift=Math.max(0,lift+velocity*dt);
  if(lift===0) velocity=0;
  const speed=245+Math.min(180,distance*.65);
  if(distance>=next) {
    items.push({x:860,type:Math.random()<.35?'ring':'crate'});
    next=distance+20+Math.random()*10;
  }
  for(const item of items) {
    item.x-=speed*dt;
    if(Math.abs(item.x-x)>25 || item.collected) continue;
    if(item.type==='ring' && lift>20 && lift<100){rings++;item.collected=true;}
    if(item.type==='crate' && lift<29){playing=false;break;}
  }
  items=items.filter(item=>item.x>-20 && !item.collected);
  score.textContent='Rings '+rings+' · Distance '+Math.floor(distance)+' m';
  draw();
  if(playing) requestAnimationFrame(update);
  else {start.disabled=false;jump.disabled=true;start.textContent='Run again';status.textContent='You ran '+Math.floor(distance)+' m and collected '+rings+' rings!';}
}
function leap(){if(playing && lift===0 && velocity===0)velocity=420;}
start.onclick=()=>{
  distance=rings=lift=velocity=0;items=[];next=0;
  playing=true;last=performance.now();start.disabled=true;jump.disabled=false;
  status.textContent='The crew is running!';
  requestAnimationFrame(update);
};
jump.onclick=leap;
canvas.addEventListener('pointerdown',leap);
document.addEventListener('keydown',event=>{
  if(!playing || event.repeat || !['Space','ArrowUp'].includes(event.code))return;
  if(event.code==='Space' && event.target===jump)return;
  event.preventDefault();leap();
});
zohan.onload = draw;
draw();
</script>
