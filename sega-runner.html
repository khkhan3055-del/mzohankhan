<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEGA game</title>
<style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#070e20;color:#fff;font:16px system-ui}#message{padding:20px}</style>
</head>
<body>
<div id="game"><p id="message" role="status">Preparing the player…</p></div>
<script>
const notify = type => parent.postMessage({type}, location.origin);
let gameUrl, received = false;
window.addEventListener('message', event => {
  if (received || event.source !== parent || event.origin !== location.origin || event.data?.type !== 'sega-game') return;
  const {core, name, bytes} = event.data;
  if (!['segaMD','segaMS','segaGG'].includes(core) || typeof name !== 'string' ||
      !(bytes instanceof ArrayBuffer) || !bytes.byteLength || bytes.byteLength > 32 * 1024 * 1024) {
    notify('sega-error');
    return;
  }
  received = true;
  gameUrl = URL.createObjectURL(new Blob([bytes], {type:'application/octet-stream'}));
  window.EJS_player = '#game';
  window.EJS_core = core;
  window.EJS_controlScheme = core;
  window.EJS_gameUrl = gameUrl;
  window.EJS_gameName = name;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/4.2.3/data/';
  window.EJS_color = '#347fc8';
  window.EJS_volume = .5;
  window.EJS_startOnLoaded = false;
  window.EJS_ready = () => notify('sega-loaded');
  window.EJS_onGameStart = () => notify('sega-playing');
  const loader = document.createElement('script');
  loader.src = window.EJS_pathtodata + 'loader.js';
  loader.onerror = () => notify('sega-error');
  document.body.append(loader);
});
window.addEventListener('error', () => notify('sega-error'));
window.addEventListener('unhandledrejection', () => notify('sega-error'));
window.addEventListener('pagehide', () => { if (gameUrl) URL.revokeObjectURL(gameUrl); });
notify('sega-ready');
</script>
</body>
</html>
